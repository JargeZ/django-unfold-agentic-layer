name: Test

# Public repository: runs only for commits already on main. No pull_request
# or pull_request_target trigger, so code from forks never runs here.
on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# No token scopes: the job only reads this public repository.
permissions: {}

jobs:
  tests:
    name: Python ${{ matrix.python }} / Django ${{ matrix.django }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
        django: ["52", "60", "61"]
        exclude:
          # Django 6.x requires Python 3.12+.
          - python: "3.11"
            django: "60"
          - python: "3.11"
            django: "61"
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - name: Run tox
        working-directory: packages/django-unfold-agentic-layer
        env:
          TOX_ENV: py${{ matrix.python }}-django${{ matrix.django }}
        # uv.lock is the only source of versions (--locked); tox-uv fetches
        # the env's Python and syncs it from the same lock.
        run: uv run --locked tox run -e "${TOX_ENV/./}"
